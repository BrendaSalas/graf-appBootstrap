<!DOCTYPE html>
<html lang="es">

<head>

    <!-- INTEGRACIÓN DEL FRAMEWORK BOOTSTRAP PARA DISEÑO Y ESTILO WEB -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visualizador RGB</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">

        <!-- TÍTULO -->
        <div class="row mt-4">

            <div class="col-12 bg-primary text-white text-center py-3">

                <h1 class="mb-0">
                    <b>Profile Card Design</b>
                </h1>

            </div>

        </div>


        <!-- TARJETAS -->
        <div class="row justify-content-center align-items-stretch g-4 p-4"
             style="background-color: #e3e3e3;">

                <div class="text-center p-3 h-100"
                     style="background-color: #f3f3f3; border-radius: 20px;">

                    <img src="assets/img/usuario1.jpg"
                         style="height: 150px; width: 150px; border-radius: 50%; object-fit: cover;"
                         alt="Usuario 1">

                    <br><br>

                    <label class="form-label">

                        <b>Person One</b>

                        <br><br>

                        Está es la persona número uno, para revisar la tarjeta de su perfil

                    </label>

                    <br><br>

                    <img src="assets/img/redes.jpg"
                         style="height: 40px; width: 140px;"
                         alt="Redes sociales">

                </div>

            </div>


            <!-- PERSONA 2 -->
            <div class="col-12 col-md-4 col-lg-3">

                </div>

            </div>


            <!-- PERSONA 3 -->
            <div class="col-12 col-md-4 col-lg-3">

                    <img src="assets/img/usuario3.jpg"

                    <img src="assets/img/redes.jpg"
                         style="height: 40px; width: 140px;"
                         alt="Redes sociales">

                </div>

            </div>

        </div>


        <!-- PIE DE PÁGINA -->
        <div class="row mt-4">

            <div class="col-12 bg-secondary text-white text-center py-3">

                <h2 class="mb-0">
                    HTML CSS BOOTSTRAP
                </h2>

            </div>

        </div>
